services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secure_vault}
      POSTGRES_USER: ${POSTGRES_USER:-secure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secure} -d ${POSTGRES_DB:-secure_vault}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  vault:
    image: hashicorp/vault:1.16
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev", "-dev-root-token-id=${VAULT_TOKEN:-root}", "-dev-listen-address=0.0.0.0:8200"]
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.16
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
    command: ["sh", "-ec", "vault secrets enable -path=transit transit || true; vault write -f transit/keys/${VAULT_TRANSIT_KEY:-tokenizer}; vault kv put secret/tokenizer fpe_key=${FPE_KEY}"]
    depends_on:
      vault:
        condition: service_healthy

  tokenizer:
    build:
      context: ./services/tokenizer
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      VAULT_URL: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
    depends_on:
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ./services/gateway/SecureVaultGateway
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-secure_vault};Username=${POSTGRES_USER:-secure};Password=${POSTGRES_PASSWORD:-secure}
      Vault__Url: http://vault:8200
      Vault__Token: ${VAULT_TOKEN:-root}
      Vault__KeyName: ${VAULT_TRANSIT_KEY:-tokenizer}
      Tokenizer__BaseUrl: http://tokenizer:8000
      Redis__ConnectionString: ${REDIS_URL:-redis:6379}
      Jwt__Key: ${JWT_KEY:-change-this-development-jwt-signing-key-to-a-long-random-value}
      Admin__Email: ${ADMIN_EMAIL:-admin@securevault.local}
      Admin__Password: ${ADMIN_PASSWORD:-ChangeMe123!}
    ports:
      - "8080:8080"
    depends_on:
      tokenizer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully

  dashboard:
    build:
      context: ./services/dashboard
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - gateway

volumes:
  postgres-data:
